<!DOCTYPE html>
<html lang="en">
 
<head>
  <meta charset="UTF-8" />
  <title>Starter Scene</title>
  <link rel="stylesheet" href="style.css" />
</head>
 
<body>
  <div id="info">click to look · WASD to move · click notebook when close to read · esc to release</div>
  <div id="crosshair"></div>
  <div id="interact-hint">click to read</div>
  <div id="message-box"></div>
 
  <!-- import maps must stay inline in the HTML — browsers don't support
       loading them from an external file -->
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
 
  <script type="module" src="main.js"></script>
</body>
 
</html>
